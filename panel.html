<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Prevención · Maestranza ALI</title><meta name="robots" content="noindex">
<style>
:root { --az:#0E3962; --rj:#FFC20E; --am:#FFF4CC; --vd:#2E7D32; --tx:#1F2328; --mu:#6B7280; --bg:#F2F2F4; --ln:#E2E3E8; }
* { box-sizing:border-box; } body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--tx); }
button, input, select, textarea { font:inherit; }
.top { background:#fff; border-bottom:4px solid var(--rj); padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
.top img { height:40px; } .top .tt { flex:1; min-width:160px; } .top .tt b { display:block; color:var(--az); letter-spacing:1px; font-size:13px; } .top .tt span { font-size:13px; color:var(--mu); }
.lnk { background:none; border:0; color:var(--az); text-decoration:underline; cursor:pointer; padding:4px; text-align:left; }
.wrap { max-width:1180px; margin:0 auto; padding:16px; }
.tabs { display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; } .tab { border:0; background:#fff; border-radius:999px; padding:9px 16px; font-weight:bold; color:var(--mu); cursor:pointer; white-space:nowrap; border:2px solid transparent; }
.tab.on { background:var(--az); color:#fff; } .tab .ct { background:#C62828; color:#fff; border-radius:999px; padding:0 7px; margin-left:6px; font-size:12px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:14px; }
.kpi { background:#fff; border-radius:14px; padding:12px 14px; border-left:6px solid var(--az); } .kpi small { display:block; font-size:11px; letter-spacing:1px; color:var(--mu); font-weight:bold; text-transform:uppercase; }
.kpi b { font-size:30px; display:block; margin-top:4px; } .kpi span { font-size:12px; color:var(--mu); }
.card { background:#fff; border-radius:14px; padding:14px; margin-bottom:14px; } .card h3 { margin:0 0 10px; font-size:15px; color:var(--az); letter-spacing:.5px; }
table { width:100%; border-collapse:collapse; font-size:14px; } th { text-align:left; font-size:11px; color:var(--mu); letter-spacing:1px; text-transform:uppercase; padding:6px; border-bottom:2px solid var(--ln); }
td { padding:8px 6px; border-bottom:1px solid var(--ln); vertical-align:middle; } .num { text-align:right; white-space:nowrap; }
.bar { height:8px; background:var(--ln); border-radius:99px; overflow:hidden; min-width:70px; } .bar i { display:block; height:100%; border-radius:99px; }
.pc { font-weight:bold; }
.filtros { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
.chip { border:2px solid var(--ln); background:#fff; border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; } .chip.on { border-color:var(--az); background:#FFF4CC; color:var(--az); font-weight:bold; }
.buscar { flex:1; min-width:180px; border:2px solid var(--ln); border-radius:10px; padding:8px 10px; } select { border:2px solid var(--ln); border-radius:10px; padding:8px; background:#fff; }
.per { display:grid; grid-template-columns:1fr auto; gap:6px 12px; padding:10px 4px; border-bottom:1px solid var(--ln); }
.per .nm { font-weight:bold; } .per .sb { font-size:12px; color:var(--mu); } .per .bd { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
.bdg { font-size:12px; border-radius:6px; padding:2px 7px; font-weight:bold; white-space:nowrap; } .ok { background:#E8F5E9; color:var(--vd); } .bad { background:#FDECEC; color:#C62828; } .warn { background:#FFF4D6; color:#8A5A00; } .gr { background:#F1F3F5; color:var(--mu); }
.atr { grid-column:1/-1; font-size:12px; color:#C62828; display:none; } .per.open .atr { display:block; } .per .av { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--mu); }
.reps { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.rep { background:#fff; border-radius:14px; overflow:hidden; display:flex; flex-direction:column; border:2px solid var(--ln); } .rep.abierto { border-color:#FFB300; }
.rep .im { height:150px; background:#ECEFF1 center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:40px; }
.rep .bx { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; } .rep .ds { font-size:14px; } .rep .mt { font-size:12px; color:var(--mu); }
.rep textarea { width:100%; border:2px solid var(--ln); border-radius:8px; padding:6px; font-size:13px; } .btn { border:0; border-radius:10px; padding:10px; font-weight:bold; cursor:pointer; background:var(--am); }
.btn.az { background:var(--az); color:#fff; }
.login { max-width:380px; margin:12vh auto; background:#fff; border-radius:18px; padding:24px; display:flex; flex-direction:column; gap:12px; text-align:center; border-top:8px solid var(--az); }
.login img { height:72px; margin:0 auto; } .login input { border:2px solid var(--ln); border-radius:10px; padding:12px; font-size:18px; text-align:center; letter-spacing:1px; }
.err { color:#C62828; font-size:13px; min-height:16px; } .vacio { color:var(--mu); padding:20px; text-align:center; }
.cargando { text-align:center; padding:40px; color:var(--mu); }
@media (max-width:600px) { .per { grid-template-columns:1fr; } .per .bd { justify-content:flex-start; } .kpi b { font-size:24px; } .ocm { display:none; } }
</style><style>.volver{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:22px;background:#1F2328;color:#fff !important;font-weight:bold;font-size:15px;text-decoration:none;white-space:nowrap}.volver:hover{opacity:.9}</style></head><body>

}
function fila(p) {
const av = pct(p.ok, p.d), ind = p.ind === 'ok' ? '<span class="bdg ok">Inducción ✔</span>' : p.ind === 'renovar' ? `<span class="bdg warn">Inducción vence ${esc(p.iv)}</span>` : '<span class="bdg bad">Sin inducción</span>';
return `<div class="per" data-p><div><div class="nm">${esc(p.n)}</div><div class="sb">${bTipo(p.t)} ${esc(p.c)} · ${esc(p.s)}</div>
<div class="av">${p.ok} de ${p.d} charlas ${bar(av)}</div></div><div class="bd">${ind}<span class="bdg ${p.ds44 ? 'ok' : 'gr'}">DS 44 ${p.ds44 ? '✔' : '—'}</span>
${p.atr && p.atr.length ? `<span class="bdg bad">${p.atr.length} atrasada${p.atr.length > 1 ? 's' : ''} ▾</span>` : '<span class="bdg ok">Al día</span>'}<span class="bdg gr">${p.pts} pts</span></div>
${p.atr && p.atr.length ? `<div class="atr">Atrasadas: ${p.atr.map(esc).join(' · ')}</div>` : ''}</div>`;
}
const enlazarFilas = () => document.querySelectorAll('[data-p]').forEach(e => e.onclick = () => e.classList.toggle('open'));
function vPersonas() {
const sucs = [...new Set(D.personas.map(p => p.s || '(sin empresa)'))].sort();
const F = { todos: () => true, sinind: p => p.ind === 'falta', atr: p => p.atr && p.atr.length, ds: p => !p.ds44, renovar: p => p.ind === 'renovar' };
const lista = D.personas.filter(F[fPer]).filter(p => !fSuc || (p.s || '(sin empresa)') === fSuc).filter(p => !fTipo || (p.t || 'Planta') === fTipo)
.filter(p => !q || (p.n + ' ' + p.r + ' ' + p.c).toLowerCase().includes(q.toLowerCase())).sort((a, b) => String(a.n).localeCompare(b.n));
$('#cont').innerHTML = `<div class="card"><div class="filtros">${[['todos', 'Todos'], ['sinind', 'Sin inducción'], ['atr', 'Atrasados'], ['ds', 'DS 44 pendiente'], ['renovar', 'Inducción por vencer']].map(([k, t]) => `<button class="chip${fPer === k ? ' on' : ''}" data-f="${k}">${t}</button>`).join('')}</div>
<div class="filtros">${TIPOS.map(([k, t]) => `<button class="chip${fTipo === k ? ' on' : ''}" data-ti="${k}">${t}</button>`).join('')}</div>
<div class="filtros"><input class="buscar" id="q" placeholder="Buscar por nombre, RUT o cargo" value="${esc(q)}">${sucs.length > 1 ? `<select id="suc"><option value="">Todas las empresas</option>${sucs.map(s => `<option${s === fSuc ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select>` : ''}</div>
<div style="font-size:12px;color:#6B7280;margin-bottom:6px">${lista.length} trabajador${lista.length === 1 ? '' : 'es'} · toca uno para ver sus charlas atrasadas</div>${lista.map(fila).join('') || '<div class="vacio">Nadie en este filtro.</div>'}</div>`;
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { fPer = b.dataset.f; vPersonas(); });
document.querySelectorAll('[data-ti]').forEach(b => b.onclick = () => { fTipo = b.dataset.ti; vPersonas(); });
$('#q').oninput = e => { q = e.target.value; clearTimeout(window.__t); window.__t = setTimeout(() => { vPersonas(); const i = $('#q'); i.focus(); i.setSelectionRange(q.length, q.length); }, 250); };
if ($('#suc')) $('#suc').onchange = e => { fSuc = e.target.value; vPersonas(); };
enlazarFilas();
}
function vReportes() {
const L = D.reportes.filter(r => fRep === 'todos' || (fRep === 'Abierto' ? r.estado !== 'Resuelto' : r.estado === 'Resuelto'));
$('#cont').innerHTML = `<div class="filtros">${[['Abierto', 'Abiertos'], ['Resuelto', 'Resueltos'], ['todos', 'Todos']].map(([k, t]) => `<button class="chip${fRep === k ? ' on' : ''}" data-r="${k}">${t}</button>`).join('')}</div>
<div class="reps">${L.map(r => `<div class="rep ${r.estado !== 'Resuelto' ? 'abierto' : ''}"><div class="im" style="${r.mini ? `background-image:url(data:image/jpeg;base64,${r.mini})` : ''}">${r.mini ? '' : '📝'}</div>
<div class="bx"><div><span class="bdg ${r.tipo === 'Casi accidente' ? 'bad' : 'warn'}">${esc(r.tipo)}</span> <span class="bdg ${r.estado === 'Resuelto' ? 'ok' : 'gr'}">${esc(r.estado)}</span></div>
<div class="ds">${esc(r.desc)}</div><div class="mt">📍 ${esc(r.s || '—')}${r.lugar ? ' · ' + esc(r.lugar) : ''}<br>👤 ${esc(r.n)}${r.c ? ' · ' + esc(r.c) : ''}<br>🕒 ${esc(r.f)}</div>
${r.foto ? `<a href="${esc(r.foto)}" target="_blank" rel="noopener" style="font-size:13px">Ver foto completa</a>` : ''}
${r.estado === 'Resuelto' ? `<div class="mt">✔ Resuelto por ${esc(r.por)} el ${esc(r.fc)}${r.com ? ': ' + esc(r.com) : ''}</div>`
: `<textarea rows="2" placeholder="¿Qué se hizo? (opcional)" data-c="${esc(r.id)}"></textarea><button class="btn" data-ok="${esc(r.id)}">Marcar resuelto</button>`}</div></div>`).join('') || '<div class="vacio">No hay reportes en este filtro.</div>'}</div>`;
document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { fRep = b.dataset.r; vReportes(); });
document.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => {
const id = b.dataset.ok, com = (document.querySelector(`[data-c="${id}"]`) || {}).value || '';
fetch(URL_API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: 'reporte_estado', h: AUTH.h, k: AUTH.k, id, estado: 'Resuelto', com }) }).catch(() => {});
const r = D.reportes.find(x => x.id === id); Object.assign(r, { estado: 'Resuelto', por: D.user.nombre, fc: new Date().toLocaleDateString('es-CL'), com }); pintar(); });
}
// Inscripciones nuevas en la nómina: el prevencionista las acepta (ACTIVO) o las rechaza (INACTIVO)
function vInscripciones() {
const L = (D.pendientes || []).filter(x => !fIns || (fIns === 'Temporero' ? x.t === 'Temporero' : x.t !== 'Temporero'));
$('#cont').innerHTML = `<div class="card"><h3>📝 INSCRIPCIONES POR ACEPTAR</h3>
<div class="filtros">${[['', 'Todas'], ['Planta', '🏭 Planta y administrativos'], ['Temporero', '🍂 Temporeros']].map(([k, t]) => `<button class="chip${fIns === k ? ' on' : ''}" data-fi="${k}">${t} (${(D.pendientes || []).filter(x => !k || (k === 'Temporero' ? x.t === 'Temporero' : x.t !== 'Temporero')).length})</button>`).join('')}</div>
<p style="margin:0 0 10px;font-size:13px;color:#6B7280">También puede aceptarlas escribiendo <b>ACTIVO</b> en la columna SITUACION de la planilla de respuestas de su empresa. Personas que llenaron la Ficha de Inscripción y aún no pueden entrar a las charlas. Al aceptar, queda <b>ACTIVO</b> en la nómina y puede ingresar de inmediato con su RUT y su clave.</p>
${L.map(x => `<div class="per"><div><div class="nm">${esc(x.n)}</div><div class="sb">${bTipo(x.t)} ${esc(x.r)} · ${esc(x.c || 'sin cargo')} · 📍 ${esc(x.s || '')}${x.f ? ' · inscrito el ' + esc(x.f) : ''}</div>${x.a ? `<div class="sb">🧭 ${esc(x.a)}${x.fu && !/^ninguna$/i.test(x.fu) ? ' · 🚦 ' + esc(x.fu) : ''}</div>` : ''}</div>
<div class="bd"><button class="btn az" data-acep="${esc(x.r)}">✔ Aceptar</button><button class="btn" style="background:#ECEFF1" data-rech="${esc(x.r)}">Rechazar</button></div></div>`).join('') || '<div class="vacio">No hay inscripciones pendientes 🎉</div>'}</div>`;
const enviar = (rut, estado, b) => { b.disabled = true; b.textContent = 'Guardando…';
fetch(URL_API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: 'inscripcion', h: AUTH.h, k: AUTH.k, rut, estado }) })
.then(() => { D.pendientes = D.pendientes.filter(x => x.r !== rut); pintar(); setTimeout(() => cargar(true), 4000); }).catch(() => { b.disabled = false; b.textContent = 'Reintentar'; }); };
document.querySelectorAll('[data-fi]').forEach(b => b.onclick = () => { fIns = b.dataset.fi; vInscripciones(); });
document.querySelectorAll('[data-acep]').forEach(b => b.onclick = () => enviar(b.dataset.acep, 'ACTIVO', b));
document.querySelectorAll('[data-rech]').forEach(b => b.onclick = () => { if (confirm('¿Rechazar esta inscripción? Quedará INACTIVO en la nómina.')) enviar(b.dataset.rech, 'INACTIVO', b); });
}

// Jefaturas del panel: las administran Daniel y Grace. Cada jefatura entra con su RUT y su clave de capacitaciones y ve su planta (o todas).
function vJefaturas() {
const J = D.jefaturas || [], N = D.nominaLite || [], sedes = D.sedes || [];
const ya = new Set(J.map(j => cleanRut(j.r))), res = qJ.trim().length >= 2 ? N.filter(p => !ya.has(cleanRut(p.r)) && (p.n + ' ' + p.r + ' ' + p.c).toLowerCase().includes(qJ.toLowerCase())).slice(0, 8) : [];
const selSuc = (v, id) => `<select data-suc-de="${esc(id)}"><option value="">Todas las empresas</option>${sedes.map(s => `<option${s === v ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select>`;
$('#cont').innerHTML = `<div class="card"><h3>👥 JEFATURAS Y ADMINISTRADORES</h3>
<p style="margin:0 0 10px;font-size:13px;color:#6B7280">Las jefaturas entran a este panel con su RUT y su misma clave de capacitaciones. Una jefatura ve solo la empresa que se le asigne; un administrador ve todo y acepta inscripciones.</p>
${J.map(j => `<div class="per" style="${j.act ? '' : 'opacity:.55'}"><div><div class="nm">${esc(j.n)}</div><div class="sb">${esc(j.r)} · ${j.rol === 'Administrador' ? '⭐ Administrador' : 'Jefatura · ' + esc(j.suc || 'todas las empresas')}</div></div>
<div class="bd">${j.rol === 'Administrador' ? '' : selSuc(j.suc, j.r)}<button class="btn" style="background:#ECEFF1" data-tog="${esc(j.r)}">${j.act ? 'Desactivar' : 'Activar'}</button></div></div>`).join('') || '<div class="vacio">Aún no hay jefaturas.</div>'}</div>
<div class="card"><h3>➕ AGREGAR JEFATURA</h3><div class="filtros"><input class="buscar" id="qJ" placeholder="Busque por nombre, RUT o cargo (debe estar en la nómina)" value="${esc(qJ)}"></div>
${res.map(p => `<div class="per"><div><div class="nm">${esc(p.n)}</div><div class="sb">${esc(p.r)} · ${esc(p.c)} · ${esc(p.s)}</div></div><div class="bd">${selSuc('', 'n' + p.r)}
<button class="btn az" data-addj="${esc(p.r)}">Jefatura</button><button class="btn" data-adda="${esc(p.r)}">Administrador</button></div></div>`).join('') || (qJ.trim().length >= 2 ? '<div class="vacio">No se encontró en la nómina activa.</div>' : '')}</div>`;
const guardar = (rut, rol, suc, activo, b) => { if (b) { b.disabled = true; b.textContent = 'Guardando…'; }
fetch(URL_API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: 'usuario', h: AUTH.h, k: AUTH.k, rut, rol, suc, activo }) })
.then(() => { const p = N.find(x => cleanRut(x.r) === cleanRut(rut)), j = J.find(x => cleanRut(x.r) === cleanRut(rut));
if (j) Object.assign(j, { rol, suc, act: activo }); else J.push({ n: p ? p.n : rut, r: rut, rol, suc, act: activo }); D.jefaturas = J; qJ = ''; vJefaturas(); setTimeout(() => cargar(true), 5000); })
.catch(() => { if (b) { b.disabled = false; b.textContent = 'Reintentar'; } }); };
const sucDe = id => { const e = document.querySelector(`[data-suc-de="${id}"]`); return e ? e.value : ''; };
document.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => { const j = J.find(x => x.r === b.dataset.tog); guardar(j.r, j.rol, j.suc, !j.act, b); });
document.querySelectorAll('[data-suc-de]').forEach(e => { if (/^n/.test(e.dataset.sucDe)) return; e.onchange = () => { const j = J.find(x => x.r === e.dataset.sucDe); guardar(j.r, j.rol, e.value, j.act); }; });
document.querySelectorAll('[data-addj]').forEach(b => b.onclick = () => guardar(b.dataset.addj, 'Jefatura', sucDe('n' + b.dataset.addj), true, b));
document.querySelectorAll('[data-adda]').forEach(b => b.onclick = () => guardar(b.dataset.adda, 'Administrador', '', true, b));
$('#qJ').oninput = e => { qJ = e.target.value; clearTimeout(window.__tj); window.__tj = setTimeout(() => { vJefaturas(); const i = $('#qJ'); i.focus(); i.setSelectionRange(qJ.length, qJ.length); }, 250); };
}
// Inicio rápido: muestra los últimos datos guardados de esta misma persona y actualiza en segundo plano
(async function () { if (!AUTH) return login(); AUTH.h = await rutHash(AUTH.rut); let pre = null;
try { pre = JSON.parse(localStorage.getItem('hsl_panel_cache') || 'null'); } catch (e) {}
if (pre && pre.ok && pre._rut === AUTH.rut) { D = pre; pintar(); cargar(true); } else cargar(); })();
</script></body></html>
